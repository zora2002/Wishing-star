<!-- @dsCard group="Colors" viewport="700x220" subtitle="Night sky, note paper, ink" name="Core Palette" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:0; font-family:var(--font-body); height:100%;">
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="flex:1; background:linear-gradient(180deg,var(--sky-top),var(--sky-mid),var(--sky-bottom));"></div>
    <div style="font-size:12px; padding:6px 8px; color:#333;">sky-top → sky-bottom</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="flex:1; background:var(--note-bg);"></div>
    <div style="font-size:12px; padding:6px 8px; color:#333;">note-bg #fdf3c7</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="flex:1; background:var(--note-ink);"></div>
    <div style="font-size:12px; padding:6px 8px; color:#333;">note-ink #3a2f1a</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="flex:1; background:var(--moon-fill);"></div>
    <div style="font-size:12px; padding:6px 8px; color:#333;">moon-fill #f6dd8e</div>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <div style="flex:1; background:var(--burst-glow);"></div>
    <div style="font-size:12px; padding:6px 8px; color:#333;">burst-glow #ffe9b8</div>
  </div>
</div>
