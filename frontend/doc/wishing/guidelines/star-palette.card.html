<!-- @dsCard group="Colors" viewport="700x140" subtitle="Randomized per floating star/wish" name="Star Palette" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid; grid-template-columns:repeat(8,1fr); gap:4px; height:100%; font-family:var(--font-body);">
  <div style="background:var(--star-1);"></div><div style="background:var(--star-2);"></div>
  <div style="background:var(--star-3);"></div><div style="background:var(--star-4);"></div>
  <div style="background:var(--star-5);"></div><div style="background:var(--star-6);"></div>
  <div style="background:var(--star-7);"></div><div style="background:var(--star-8);"></div>
  <div style="background:var(--star-9);"></div><div style="background:var(--star-10);"></div>
  <div style="background:var(--star-11);"></div><div style="background:var(--star-12);"></div>
  <div style="background:var(--star-13);"></div><div style="background:var(--star-14);"></div>
  <div style="background:var(--star-15);"></div><div style="background:var(--star-16);"></div>
</div>
